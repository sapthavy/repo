<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans Lao',sans-serif;background-color:#f3f4f6}
.tab-content{display:none}
.tab-content.active{display:block}
#printable-report{display:none}
@media print{
body>*:not(#printable-report){display:none !important}
#printable-report{display:block !important;position:absolute;left:0;top:0;width:100%;background:white;z-index:9999}
th,td{border:1px solid #333 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body class="bg-gray-100 flex flex-col h-screen justify-between">

<header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between z-10">
<h1 class="text-lg font-bold text-gray-800">ລະບົບຕິດຕາມລົດອອກ-ກັບ 🚗</h1>
<button onclick="printSummaryReport()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg text-sm font-medium transition">🖨 ປິ້ນລາຍງານລວມ</button>
</header>

<main class="flex-1 overflow-y-auto p-4 max-w-lg mx-auto w-full">

<div id="page-0" class="tab-content active space-y-4">
<div class="grid grid-cols-2 gap-3">
<div class="bg-white p-4 rounded-xl border border-gray-200">
<p class="text-gray-400 text-xs">ລົດອອກ</p>
<p id="parked-count" class="text-2xl font-bold text-blue-600 mt-1">0</p>
</div>
<div class="bg-white p-4 rounded-xl border border-gray-200">
<p class="text-gray-400 text-xs">ລົດກັບ</p>
<p id="exited-today-count" class="text-2xl font-bold text-green-600 mt-1">0</p>
</div>
</div>

<div class="bg-white p-4 rounded-2xl border border-gray-200 space-y-4">
<h2 class="text-base font-bold text-gray-800">ລົງທະບຽນລົດອອກ</h2>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">ເລກທະບຽນລົດ *</label>
<input type="text" id="plate-input" placeholder="ຕົວຢ່າງ: ກກ 1234" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">ປະເພດລົດ *</label>
<select id="type-select" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
<option value="ລົດຈັກ">ລົດຈັກ</option>
<option value="ລົດໃຫຍ່" selected>ລົດໃຫຍ່</option>
<option value="ລົດຕູ້">ລົດຕູ້</option>
<option value="ລົດບັນທຸກ">ລົດບັນທຸກ</option>
</select>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">ວັນທີອອກ *</label>
<input type="date" id="date-in-input" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">ເວລາອອກ *</label>
<input type="time" id="time-in-input" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">ເລກກົງເຕີລົດ (ຕອນອອກ)</label>
<input type="text" id="meter-in-input" placeholder="ຕົວຢ່າງ: 12450" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">ໝາຍເຫດ / ຊື່ຄົນຂັບ (ທາງເລືອກ)</label>
<input type="text" id="note-input" placeholder="ຊື່ ຫຼື ເບີໂທຕິດຕໍ່..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
<button onclick="addVehicle()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition"><span>✔</span> ບັນທຶກລົດອອກ</button>
</div>
</div>

<div id="page-1" class="tab-content space-y-3">
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
<input type="text" id="search-input" oninput="filterParkedVehicles()" placeholder="ຄົ້ນຫາທະບຽນລົດ..." class="w-full pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
<div id="parked-list" class="space-y-3"></div>
</div>

<div id="page-2" class="tab-content space-y-3">
<div class="flex items-center justify-between">
<h2 class="text-base font-bold text-gray-800">ປະຫວັດລົດທີ່ກັບແລ້ວ</h2>
<button onclick="clearHistory()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-red-100 transition">🗑 ລ້າງປະຫວັດທັງໝົດ</button>
</div>
<div id="exited-list" class="space-y-3"></div>
</div>

</main>

<div id="exit-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
<div class="bg-white rounded-2xl p-6 max-w-sm w-full space-y-4">
<h3 class="text-lg font-bold text-gray-800">ແຈ້ງລົດກັບ</h3>
<p id="modal-plate-text" class="text-sm font-semibold text-blue-600"></p>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">ເລກກົງເຕີລົດ (ຕອນກັບ)</label>
<input type="text" id="modal-meter-out" placeholder="ຕົວຢ່າງ: 12520" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">ວັນທີກັບ *</label>
<input type="date" id="modal-date-out" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">ເວລາກັບ *</label>
<input type="time" id="modal-time-out" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>
</div>
<div class="flex gap-2 pt-2">
<button onclick="closeExitModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 rounded-lg transition">ຍົກເລີກ</button>
<button onclick="confirmExit()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-medium py-2 rounded-lg transition">ຢືນຢັນລົດກັບ</button>
</div>
</div>
</div>

<nav class="bg-white border-t border-gray-200 flex justify-around py-3">
<button onclick="switchTab(0)" id="nav-btn-0" class="flex flex-col items-center text-blue-600"><span class="text-xl">➕</span><span class="text-xs mt-1">ລົງທະບຽນ</span></button>
<button onclick="switchTab(1)" id="nav-btn-1" class="flex flex-col items-center text-gray-400"><span class="text-xl">🚗</span><span class="text-xs mt-1">ກຳລັງຈອດ</span></button>
<button onclick="switchTab(2)" id="nav-btn-2" class="flex flex-col items-center text-gray-400"><span class="text-xl">📜</span><span class="text-xs mt-1">ປະຫວັດ</span></button>
</nav>

<div id="printable-report">
<div style="font-family:'Noto Sans Lao',sans-serif;padding:20px;color:#333;">
<div style="text-align:center;margin-bottom:15px;">
<h2 style="font-size:18px;font-weight:bold;margin-bottom:5px;">ລາຍງານປະຫວັດການໃຊ້ພາຫະນະລົດຈັກຂອງສະຖາບັນ</h2>
<p id="report-date-time" style="font-size:12px;color:#666;"></p>
</div>
<table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:25px;">
<thead>
<tr style="background-color:#f2f2f2;">
<th style="padding:6px;border:1px solid #ddd;text-align:center;">ລຳດັບ</th>
<th style="padding:6px;border:1px solid #ddd;text-align:center;">ວັນທີ</th>
<th style="padding:6px;border:1px solid #ddd;text-align:left;">ເລກທະບຽນ</th>
<th style="padding:6px;border:1px solid #ddd;text-align:left;">ປະເພດ</th>
<th style="padding:6px;border:1px solid #ddd;text-align:center;">ກົງເຕີ (ອອກ-ກັບ)</th>
<th style="padding:6px;border:1px solid #ddd;text-align:center;">ເວລາອອກ ➔ ກັບ</th>
<th style="padding:6px;border:1px solid #ddd;text-align:center;">ສະຖານະ</th>
<th style="padding:6px;border:1px solid #ddd;text-align:left;">ໝາຍເຫດ</th>
<th style="padding:6px;border:1px solid #ddd;text-align:center;">ລາຍເຊັນພາຫະນະ</th>
</tr>
</thead>
<tbody id="report-combined-tbody"></tbody>
</table>
<div style="display:flex;justify-content:flex-end;margin-top:20px;font-size:12px;">
<div style="text-align:center;width:40%;">
<p>ຜູ້ບັນທຶກ</p><br><br>
<p>.......................................................</p>
</div>
</div>
</div>
</div>

<script>
const STORAGE_KEY = 'vehicles';

function loadVehicles() {
    try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(data) ? data : [];
    } catch (e) {
        return [];
    }
}

function saveVehicles() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(vehicles));
    } catch (e) {
        console.error('Cannot save data', e);
    }
}

// ປ້ອງກັນ HTML injection
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let vehicles = loadVehicles();
let currentTab = 0;
let selectedVehicleIdForExit = null;

function switchTab(index) {
    currentTab = index;
    document.querySelectorAll('.tab-content').forEach((el, i) => {
        el.classList.toggle('active', i === index);
    });
    for (let i = 0; i < 3; i++) {
        const btn = document.getElementById(`nav-btn-${i}`);
        btn.classList.toggle('text-blue-600', i === index);
        btn.classList.toggle('text-gray-400', i !== index);
    }
}

function formatTime(date) {
    if (!date) return '-';
    const d = new Date(date);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function formatDate(date) {
    if (!date) return '-';
    const d = new Date(date);
    return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
}

function addVehicle() {
    const plateInput = document.getElementById('plate-input');
    const typeSelect = document.getElementById('type-select');
    const meterInInput = document.getElementById('meter-in-input');
    const noteInput = document.getElementById('note-input');

    const plate = plateInput.value.trim();
    if (!plate) {
        alert('ກະລຸນາປ້ອນເລກທະບຽນລົດ!');
        return;
    }

    const dateIn = document.getElementById('date-in-input').value;
    const timeInVal = document.getElementById('time-in-input').value;
    if (!dateIn || !timeInVal) {
        alert('ກະລຸນາປ້ອນວັນທີ ແລະ ເວລາອອກ!');
        return;
    }

    vehicles.unshift({
        id: Date.now().toString(),
        plate: plate,
        type: typeSelect.value,
        meterIn: meterInInput.value.trim() || '-',
        meterOut: '-',
        note: noteInput.value.trim(),
        timeIn: new Date(`${dateIn}T${timeInVal}`),
        timeOut: null,
        status: 'parked'
    });

    plateInput.value = '';
    meterInInput.value = '';
    noteInput.value = '';
    document.getElementById('time-in-input').value = '';

    updateUI();
    switchTab(1);
}

function openExitModal(id) {
    selectedVehicleIdForExit = id;
    const v = vehicles.find(item => item.id === id);
    if (v) {
        document.getElementById('modal-plate-text').innerText = `ທະບຽນ: ${v.plate.toUpperCase()}`;
        document.getElementById('modal-meter-out').value = '';
        const d0 = new Date(v.timeIn);
        document.getElementById('modal-date-out').value = `${d0.getFullYear()}-${String(d0.getMonth() + 1).padStart(2, '0')}-${String(d0.getDate()).padStart(2, '0')}`;
        document.getElementById('modal-time-out').value = '';
        document.getElementById('exit-modal').classList.remove('hidden');
    }
}

function closeExitModal() {
    document.getElementById('exit-modal').classList.add('hidden');
    selectedVehicleIdForExit = null;
}

function confirmExit() {
    if (!selectedVehicleIdForExit) return;
    const meterOutVal = document.getElementById('modal-meter-out').value.trim();
    const vehicle = vehicles.find(v => v.id === selectedVehicleIdForExit);
    if (vehicle) {
        const dateOut = document.getElementById('modal-date-out').value;
        const timeOutVal = document.getElementById('modal-time-out').value;
        if (!dateOut || !timeOutVal) {
            alert('ກະລຸນາປ້ອນວັນທີ ແລະ ເວລາກັບ!');
            return;
        }
        const out = new Date(`${dateOut}T${timeOutVal}`);
        if (out < new Date(vehicle.timeIn)) {
            alert('ເວລາກັບຕ້ອງບໍ່ກ່ອນເວລາອອກ!');
            return;
        }
        vehicle.status = 'exited';
        vehicle.timeOut = out;
        vehicle.meterOut = meterOutVal || '-';
        updateUI();
    }
    closeExitModal();
}

function updateUI() {
    saveVehicles();

    const parkedList = vehicles.filter(v => v.status === 'parked');
    const exitedList = vehicles.filter(v => v.status === 'exited');

    document.getElementById('parked-count').innerText = parkedList.length;

    const today = new Date();
    const exitedToday = exitedList.filter(v => {
        const o = new Date(v.timeOut);
        return o.getDate() === today.getDate() &&
               o.getMonth() === today.getMonth() &&
               o.getFullYear() === today.getFullYear();
    });
    document.getElementById('exited-today-count').innerText = exitedToday.length;

    renderParkedList(parkedList);
    renderExitedList(exitedList);
}

function renderParkedList(list) {
    const container = document.getElementById('parked-list');
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = list.filter(v => v.plate.toLowerCase().includes(q));

    if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-10">ບໍ່ມີລົດກຳລັງຈອດ</div>`;
        return;
    }

    container.innerHTML = filtered.map(v => `
        <div class="bg-white p-4 rounded-xl border border-gray-200 flex justify-between items-center">
            <div>
                <h3 class="font-bold text-gray-800 text-base">${esc(v.plate.toUpperCase())}</h3>
                <p class="text-sm text-gray-600 mt-0.5">ປະເພດ: ${esc(v.type)} | ອອກ: ${formatDate(v.timeIn)} ${formatTime(v.timeIn)}</p>
                <p class="text-xs text-gray-500 mt-0.5">ກົງເຕີອອກ: ${esc(v.meterIn)}</p>
                ${v.note ? `<p class="text-xs text-gray-400 mt-1">ໝາຍເຫດ: ${esc(v.note)}</p>` : ''}
            </div>
            <div class="flex flex-col gap-2">
                <button onclick="openExitModal('${esc(v.id)}')" class="bg-red-50 text-red-600 px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-100 transition">ແຈ້ງກັບ</button>
                <button onclick="deleteVehicle('${esc(v.id)}')" class="bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg text-xs hover:bg-gray-200 transition">🗑 ລຶບ</button>
            </div>
        </div>
    `).join('');
}

function deleteVehicle(id) {
    const v = vehicles.find(item => item.id === id);
    if (!v) return;
    if (!confirm(`ລຶບລາຍການ ${v.plate.toUpperCase()} ແທ້ບໍ? ກູ້ຄືນບໍ່ໄດ້`)) return;
    vehicles = vehicles.filter(item => item.id !== id);
    updateUI();
}

function clearHistory() {
    const count = vehicles.filter(v => v.status === 'exited').length;
    if (count === 0) {
        alert('ຍັງບໍ່ມີປະຫວັດໃຫ້ລຶບ');
        return;
    }
    if (!confirm(`ລຶບປະຫວັດລົດທີ່ກັບແລ້ວທັງໝົດ ${count} ລາຍການ? ກູ້ຄືນບໍ່ໄດ້`)) return;
    vehicles = vehicles.filter(v => v.status !== 'exited');
    updateUI();
}

function filterParkedVehicles() {
    renderParkedList(vehicles.filter(v => v.status === 'parked'));
}

function renderExitedList(list) {
    const container = document.getElementById('exited-list');

    if (list.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-10">ຍັງບໍ່ມີປະຫວັດການກັບ</div>`;
        return;
    }

    container.innerHTML = list.map(v => `
        <div class="bg-white p-4 rounded-xl border border-gray-200">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-gray-800">${esc(v.plate.toUpperCase())}</h3>
                <button onclick="deleteVehicle('${esc(v.id)}')" class="bg-gray-100 text-gray-600 px-3 py-1 rounded-lg text-xs hover:bg-gray-200 transition">🗑 ລຶບ</button>
            </div>
            <p class="text-xs text-gray-600 mt-1">ປະເພດ: ${esc(v.type)}</p>
            <p class="text-xs text-gray-500 mt-0.5">ກົງເຕີ: ອອກ [${esc(v.meterIn)}] ➔ ກັບ [${esc(v.meterOut)}]</p>
            <p class="text-xs text-gray-500 mt-0.5">ອອກ: ${formatDate(v.timeIn)} ${formatTime(v.timeIn)} | ກັບ: ${formatDate(v.timeOut)} ${formatTime(v.timeOut)}</p>
            ${v.note ? `<p class="text-xs text-gray-400 mt-0.5">ໝາຍເຫດ: ${esc(v.note)}</p>` : ''}
        </div>
    `).join('');
}

function printSummaryReport() {
    const now = new Date();
    document.getElementById('report-date-time').innerText = `ວັນທີພິມ: ${formatDate(now)} ເວລາ: ${formatTime(now)}`;

    const tbody = document.getElementById('report-combined-tbody');
    if (vehicles.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:15px;border:1px solid #ddd;color:#777;">ຍັງບໍ່ມີຂໍ້ມູນການອອກ - ກັບ</td></tr>`;
    } else {
        tbody.innerHTML = vehicles.map((v, index) => {
            const parked = v.status === 'parked';
            const statusText = parked
                ? '<span style="color:blue;font-weight:bold;">ກຳລັງຈອດ</span>'
                : '<span style="color:green;font-weight:bold;">ກັບແລ້ວ</span>';
            const timeInfo = parked
                ? `${formatTime(v.timeIn)} ➔ -`
                : `${formatTime(v.timeIn)} ➔ ${formatTime(v.timeOut)}`;
            const meterInfo = parked
                ? `ອອກ: ${esc(v.meterIn)}`
                : `ອອກ: ${esc(v.meterIn)} / ກັບ: ${esc(v.meterOut)}`;

            return `
                <tr>
                    <td style="padding:6px;border:1px solid #ddd;text-align:center;">${index + 1}</td>
                    <td style="padding:6px;border:1px solid #ddd;text-align:center;">${formatDate(v.timeIn)}</td>
                    <td style="padding:6px;border:1px solid #ddd;font-weight:bold;">${esc(v.plate.toUpperCase())}</td>
                    <td style="padding:6px;border:1px solid #ddd;">${esc(v.type)}</td>
                    <td style="padding:6px;border:1px solid #ddd;text-align:center;">${meterInfo}</td>
                    <td style="padding:6px;border:1px solid #ddd;text-align:center;">${timeInfo}</td>
                    <td style="padding:6px;border:1px solid #ddd;text-align:center;">${statusText}</td>
                    <td style="padding:6px;border:1px solid #ddd;">${esc(v.note) || '-'}</td>
                    <td style="padding:6px;border:1px solid #ddd;text-align:center;height:30px;"></td>
                </tr>`;
        }).join('');
    }

    window.print();
}

// ໂຫຼດຂໍ້ມູນເກົ່າຂຶ້ນມາສະແດງຕອນເປີດໜ້າ
updateUI();
</script>
</body>
</html>
